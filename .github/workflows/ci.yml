# Intégration continue (brief, phase 5 ; ARCHITECTURE 15.7) : à chaque envoi sur GitHub, et à la demande, les
# contrôles exigés avant un commit (CLAUDE.md), la taille du Worker et les parcours de fumée.
# Environ trois minutes par exécution : gratuites pour un dépôt public, sur les 2 000 minutes par mois d'un
# dépôt privé.
name: ci

on:
  push:
    # Exclu : le cache de la veille, que seule la tâche « veille » enregistre, sur main. La construction de
    # Cloudflare le relit et échoue s'il est illisible; les parcours de fumée n'y ajouteraient rien. Tout autre
    # envoi est vérifié, documentation comprise : chaque commit de tête porte ainsi un résultat.
    paths-ignore:
      - 'data/veille/cache.json'
  # Pas de déclencheur pull_request : une demande de fusion affiche le résultat de l'envoi de son dernier
  # commit, sans second passage.
  workflow_dispatch:

permissions:
  contents: read

# Un nouvel envoi sur la même branche remplace la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : le rapport date la dernière modification de chaque contenu.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Format de l'éditeur
        run: npm run content:format -- --verifier
      - name: Construction de production
        run: npm run build
      - name: Taille du Worker
        run: npm run worker:size
      - name: Navigateur des parcours
        run: npx playwright install --with-deps chromium
      - name: Parcours de fumée
        run: npm run test:e2e
      - name: Rapport des parcours
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
